<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الملف — Z-PACT</title>
  <link rel="icon" href="/frontend/assets/logo.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    
    <!-- Global CSS -->
    <link rel="stylesheet" href="/frontend/css/global.css?v=2.0.0">
    
    <!-- PDF.js -->
    <script src="/frontend/js/vendor/pdf.min.js"></script>
    <script>
        const pdfjsLib = window['pdfjs-dist/build/pdf'];
        if (pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = '/frontend/js/vendor/pdf.worker.min.js';
        }
    </script>
    
    <!-- StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    
    <style>
        body {
            background: #020617;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto; overflow-x: hidden;
            margin: 0;
            font-family: 'Cairo', sans-serif;
        }

        .preview-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        #flipbook {
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            background: #fff;
        }

        .page {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto; overflow-x: hidden;
        }

        .page canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .controls {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
            font-size: 20px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .page-num {
            color: #fff;
            display: flex;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            padding: 0 10px;
        }

        /* Loading Overlay */
        .loader-overlay {
            position: fixed;
            inset: 0;
            background: #020617;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .buy-now-hint { display: none;
            position: fixed;
            top: 50%;
            right: 2rem;
            transform: translateY(-50%);
            width: 250px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            text-align: center;
        }

        @media (max-width: 768px) {
            .preview-header {
                padding: 0.75rem 1rem;
            }
            .preview-container {
                padding: 1rem 0.5rem;
            }
            .controls {
                bottom: 1rem;
                padding: 0.4rem 0.8rem;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>

    <div id="loader" class="loader-overlay">
        <div class="spinner" style="width: 50px; height: 50px; border-top-color: var(--primary);"></div>
        <h3 class="mt-2 text-white">جاري تحميل المعاينة...</h3>
    </div>

    <header class="preview-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="btn btn-ghost btn-sm" onclick="window.close()" style="font-size:14px; font-weight:700;">✖ إغلاق</button>
            <div>
                <h1 id="mat-title" style="font-size: 16px; color: #fff; margin: 0; font-weight:800;">اسم المذكرة</h1>
                <p style="font-size: 11px; color: var(--text-muted); margin: 0;">معاينة محمية (أول 5 صفحات)</p>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button class="btn btn-primary btn-sm" onclick="handleBuy()" style="font-weight:800; border-radius:12px; box-shadow:0 0 15px rgba(56,189,248,0.4); padding:6px 14px;">
                ⚡ شراء المذكرة
            </button>
        </div>
    </header>

    <div class="preview-container">
        <div id="flipbook"></div>
    </div>

    <div class="controls">
        <button class="control-btn" onclick="flipbook.flipNext()">⬅</button>
        <div class="page-num"><span id="curr-page">1</span> / <span id="total-pages">0</span></div>
        <button class="control-btn" onclick="flipbook.flipPrev()">➡</button>
    </div>

    <div class="buy-now-hint">
        <h3 style="color: #fff; margin-bottom: 10px;">أعجبتك المذكرة؟</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem;">يمكنك الحصول عليها فوراً بضغطة واحدة من المتجر.</p>
        <button class="btn btn-primary btn-full" onclick="handleBuy()">شراء الآن</button>
    </div>

    <script src="/frontend/js/api.js"></script>
    <script>
        let flipbook = null;
        let pdf = null;
        const urlParams = new URLSearchParams(window.location.search);
        const materialId = urlParams.get('id');

        async function initPreview() {
            if (!materialId) return;

            try {
                // 1. Get Material Info
                const mat = await materialsAPI.get(materialId);
                document.getElementById('mat-title').textContent = mat.title;

                // 2. Request Preview Token (for 5 pages)
                const tokenData = await materialsAPI.getPreviewToken(materialId, 5);
                const token = tokenData.token;
                const allowedPages = tokenData.allowed_pages || [1, 2, 3, 4, 5];
                
                const pagesToRender = Math.min(allowedPages.length, 5);
                document.getElementById('total-pages').textContent = pagesToRender;

                const flipbookEl = document.getElementById('flipbook');
                
                // 3. Render Pages using the secure stream API
                for (let i = 0; i < pagesToRender; i++) {
                    const pageNum = allowedPages[i];
                    
                    // Fetch page as ArrayBuffer (one-page PDF)
                    const arrayBuffer = await materialsAPI.getPreviewPage(token, pageNum);
                    
                    const loadingTask = pdfjsLib.getDocument({
                        data: arrayBuffer,
                        cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
                        cMapPacked: true,
                    });
                    
                    const pdfDoc = await loadingTask.promise;
                    const page = await pdfDoc.getPage(1); // Each buffer is a 1-page PDF
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    pageDiv.appendChild(canvas);
                    flipbookEl.appendChild(pageDiv);
                }

                // 4. Initialize StPageFlip
                flipbook = new St.PageFlip(flipbookEl, {
                    width: 550,
                    height: 750,
                    size: "stretch",
                    minWidth: 315,
                    maxWidth: 1000,
                    minHeight: 420,
                    maxHeight: 1350,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false
                });

                flipbook.loadFromHTML(document.querySelectorAll('.page'));

                flipbook.on('flip', (e) => {
                    document.getElementById('curr-page').textContent = e.data + 1;
                });

                document.getElementById('loader').style.display = 'none';

            } catch (err) {
                console.error(err);
                alert("فشل تحميل المعاينة: " + err.message);
                document.getElementById('loader').innerHTML = `<h3 style='color:red'>⚠️ ${err.message}</h3>`;
            }
        }

        function handleBuy() {
            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.focus();
                    if (typeof window.opener.openPreview === 'function') {
                        window.opener.openPreview(materialId);
                    }
                    window.close();
                    return;
                } catch (e) {}
            }
            window.location.href = `/frontend/pages/store.html`;
        }

        initPreview();
    </script>
</body>
</html>
